<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#182b35">
<title>Conducción bajo la lluvia</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#182b35;font-family:system-ui,Arial;color:#fff;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;inset:0;pointer-events:none}
.pill{position:absolute;background:#10212dcc;border:1px solid #ffffff30;border-radius:14px;padding:8px 12px;font-weight:700;text-shadow:0 2px 3px #000}
#speed{left:14px;top:14px;font-size:18px}#weather{right:14px;top:14px;font-size:13px}
#controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 14px;pointer-events:auto}
.ctrl{width:68px;height:68px;border-radius:50%;border:1px solid #ffffff88;background:#152b39bb;color:white;font-size:27px;backdrop-filter:blur(5px);touch-action:none}
#pedals{display:flex;gap:8px;align-items:end}.pedal{width:65px;height:65px;border-radius:16px;font-size:12px;font-weight:800}
#gears{position:absolute;right:14px;bottom:105px;display:flex;gap:7px;pointer-events:auto}
.gearbtn{width:42px;height:42px;border:1px solid #ffffff88;border-radius:12px;background:#152b39dd;color:white;font-weight:900;font-size:17px}
#gear{right:14px;top:62px;font-size:13px}
#menu{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#102331aa,#102331dd);padding:22px}
.panel{width:min(440px,94vw);text-align:center;background:#183341eF;border:1px solid #ffffff35;border-radius:24px;padding:28px 22px;box-shadow:0 18px 60px #0008}
h1{font-size:clamp(28px,7vw,42px);margin:0 0 8px}p{color:#d5e2e7;line-height:1.45}
.action{border:0;border-radius:14px;padding:13px 22px;font-weight:800;font-size:17px;color:#10212b;background:#d9eee8;margin:7px;min-width:145px}
#hint{font-size:12px;opacity:.8}
@media(orientation:portrait){.panel{padding:22px 18px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div id="speed" class="pill">0 km/h</div>
 <div id="weather" class="pill">Lluvia: ligera</div>
 <div id="gear" class="pill">CAMBIO: 1</div>
 <div id="gears"><button class="gearbtn" id="downGear">−</button><button class="gearbtn" id="upGear">+</button></div>
 <div id="controls">
  <button class="ctrl" id="left" aria-label="Girar a la izquierda">◀</button>
  <div id="pedals"><button class="ctrl pedal" id="brake">FRENO</button><button class="ctrl pedal" id="gas">ACELERAR</button></div>
  <button class="ctrl" id="right" aria-label="Girar a la derecha">▶</button>
 </div>
</div>
<div id="menu">
 <div class="panel">
  <h1>Conducción<br>bajo la lluvia</h1>
  <p>Vista desde el asiento del conductor: toma el volante, acelera, frena y cambia de marcha mientras recorres el bosque bajo la lluvia.</p>
  <button class="action" id="play">JUGAR</button>
  <button class="action" id="audio">Desactivar audio</button>
  <p id="hint">Prototipo web · Controles táctiles o teclado</p>
 </div>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let w,h,dpr,playing=false,speed=0,steer=0,position=0,curve=0,rain=0.35,audioOn=true,ac=null,osc=null,gear=1;
let gas=false,brake=false,left=false,right=false,last=0,elapsed=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function sound(){if(!audioOn)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}}
function tone(){if(!audioOn||!ac)return;let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=115;g.gain.value=.012;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.18)}
function polygon(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill()}
function drawTree(x,y,s){ctx.fillStyle='#352c25';ctx.fillRect(x-s*.09,y-s*.1,s*.18,s*.65);polygon([[x,y-s],[x-s*.48,y-s*.12],[x-s*.27,y-s*.18],[x-s*.62,y+s*.1],[x+s*.62,y+s*.1],[x+s*.27,y-s*.18],[x+s*.48,y-s]],'#244c40')}
function render(dt){
 elapsed+=dt;let horizon=h*.39,center=w*.5,roadW=Math.min(w*.78,560);
 let sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#7898a2');sky.addColorStop(1,'#c1d0ca');ctx.fillStyle=sky;ctx.fillRect(0,0,w,horizon);
 // soft clouds
 for(let i=0;i<8;i++){let x=(i*197+elapsed*3)%(w+180)-90;ctx.fillStyle='#e3ece8aa';ctx.beginPath();ctx.ellipse(x,horizon*.28+(i%3)*18,65,17,0,0,Math.PI*2);ctx.fill()}
 let ground=ctx.createLinearGradient(0,horizon,0,h);ground.addColorStop(0,'#54765d');ground.addColorStop(1,'#1f4939');ctx.fillStyle=ground;ctx.fillRect(0,horizon,w,h-horizon);
 // road perspective bands with curving center
 for(let i=0;i<34;i++){let z=i/34,y=horizon+(h-horizon)*z*z;let z2=(i+1)/34,y2=horizon+(h-horizon)*z2*z2;let c1=center+Math.sin(position*.0007+z*3.8)*roadW*.28+steer*20;let c2=center+Math.sin(position*.0007+z2*3.8)*roadW*.28+steer*20;let rw1=roadW*(.08+.92*z),rw2=roadW*(.08+.92*z2);polygon([[c1-rw1/2,y],[c1+rw1/2,y],[c2+rw2/2,y2],[c2-rw2/2,y2]],i%2?'#454d4e':'#4b5354');
 let edge1=rw1*.035,edge2=rw2*.035;polygon([[c1-rw1/2,y],[c1-rw1/2+edge1,y],[c2-rw2/2+edge2,y2],[c2-rw2/2,y2]],'#d8d6c5');polygon([[c1+rw1/2-edge1,y],[c1+rw1/2,y],[c2+rw2/2,y2],[c2+rw2/2-edge2,y2]],'#d8d6c5');
 if(i%2===0){polygon([[c1-edge1*.45,y],[c1+edge1*.45,y],[c2+edge2*.45,y2],[c2-edge2*.45,y2]],'#e5dfb9')}
 }
 // trees
 for(let side of [-1,1])for(let i=0;i<13;i++){let z=((i/13+(position*.00012)%1)%1);let y=horizon+(h-horizon)*z*z;let bend=Math.sin(position*.0007+z*3.8)*roadW*.28;let x=center+bend+side*(roadW*(.12+z*.95));drawTree(x,y,8+z*75)}
 // Interior del automóvil: marco del parabrisas, tablero y capó
 polygon([[0,0],[w*.075,0],[w*.17,h*.66],[w*.19,h*.84],[0,h]],'#182328');
 polygon([[w,0],[w*.925,0],[w*.83,h*.66],[w*.81,h*.84],[w,h]],'#182328');
 polygon([[0,h*.82],[w*.18,h*.76],[w*.34,h*.79],[w*.66,h*.79],[w*.82,h*.76],[w,h*.82],[w,h],[0,h]],'#10191d');
 polygon([[w*.22,h],[w*.30,h*.86],[w*.70,h*.86],[w*.78,h]],'#202a2e');
 polygon([[w*.29,h],[w*.35,h*.9],[w*.65,h*.9],[w*.71,h]],'#303b3f');
 // Panel de instrumentos
 polygon([[w*.36,h*.89],[w*.40,h*.82],[w*.60,h*.82],[w*.64,h*.89]],'#111719');
 ctx.fillStyle='#b9d7cb';ctx.font=`bold ${Math.max(11,w*.018)}px system-ui`;ctx.textAlign='center';
 ctx.fillText('CLASSIC',w*.5,h*.865);
 // Volante en primer plano, gira con la dirección
 ctx.save();ctx.translate(w*.5,h*.91);ctx.rotate(steer*.62);
 ctx.strokeStyle='#101619';ctx.lineWidth=Math.max(12,w*.025);ctx.beginPath();ctx.arc(0,0,Math.min(w*.105,48),0,Math.PI*2);ctx.stroke();
 ctx.lineWidth=Math.max(7,w*.012);ctx.beginPath();ctx.moveTo(0,-Math.min(w*.105,48));ctx.lineTo(0,Math.min(w*.08,36));ctx.moveTo(-Math.min(w*.09,41),0);ctx.lineTo(Math.min(w*.09,41),0);ctx.stroke();
 ctx.fillStyle='#344247';ctx.beginPath();ctx.arc(0,0,Math.min(w*.035,16),0,Math.PI*2);ctx.fill();ctx.restore();
 // Palanca de cambios visible junto al volante
 ctx.strokeStyle='#0b1114';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(w*.72,h);ctx.lineTo(w*.70,h*.91);ctx.stroke();
 ctx.fillStyle='#080d10';ctx.beginPath();ctx.arc(w*.70,h*.905,7,0,Math.PI*2);ctx.fill();
 // gotas en el parabrisas
 let drops=Math.floor(rain*85);ctx.strokeStyle='#e8f5ff88';ctx.lineWidth=1;
 for(let i=0;i<drops;i++){let x=(i*83+elapsed*(20+(i%5)*8))%w,y=(i*47+elapsed*(45+(i%7)*9))%horizon;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-3,y+10+rain*9);ctx.stroke()}
 // rain across view
 ctx.strokeStyle='#dceef055';for(let i=0;i<Math.floor(rain*100);i++){let x=(i*71+elapsed*95)%w,y=(i*113+elapsed*170)%h;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-5,y+13);ctx.stroke()}
 document.getElementById('speed').textContent=Math.round(speed)+' km/h';
 document.getElementById('weather').textContent='Lluvia: '+(rain<.3?'ligera':rain<.65?'moderada':'intensa');
 document.getElementById('gear').textContent='CAMBIO: '+(gear===0?'N':gear===1?'1':gear===2?'2':gear===3?'3':gear===4?'4':gear===5?'5':'6');
}
function frame(t){let dt=Math.min((t-last)/1000||0,.05);last=t;if(playing){let gearLimit=[0,24,42,60,78,96,115][gear];let target=gas?gearLimit:brake?0:Math.min(gearLimit,28);speed+=(target-speed)*dt*(gas?1.15:1.8);steer+=( (right?1:0)-(left?1:0) - steer)*dt*4;position+=speed*dt*42;rain=.42+.3*Math.sin(elapsed*.17)+.16*Math.sin(elapsed*.071);rain=Math.max(.12,Math.min(.92,rain));}render(dt);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
function start(){sound();playing=true;document.getElementById('menu').style.display='none';last=performance.now()}
document.getElementById('play').onclick=start;
document.getElementById('upGear').onclick=()=>{gear=Math.min(6,gear+1);tone()};
document.getElementById('downGear').onclick=()=>{gear=Math.max(0,gear-1);tone()};
document.getElementById('audio').onclick=()=>{audioOn=!audioOn;document.getElementById('audio').textContent=audioOn?'Desactivar audio':'Activar audio';if(audioOn)sound()};
function bind(id,key){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();window[key]=true;el.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>window[key]=false))}
bind('gas','gas');bind('brake','brake');bind('left','left');bind('right','right');
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')left=true;if(e.key==='ArrowRight'||e.key==='d')right=true;if(e.key==='ArrowUp'||e.key==='w')gas=true;if(e.key==='ArrowDown'||e.key==='s')brake=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')left=false;if(e.key==='ArrowRight'||e.key==='d')right=false;if(e.key==='ArrowUp'||e.key==='w')gas=false;if(e.key==='ArrowDown'||e.key==='s')brake=false});
})();
</script>
</body></html>
